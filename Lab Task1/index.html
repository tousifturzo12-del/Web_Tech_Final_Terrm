<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Café - Food Ordering System</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>☕ Campus Café</h1>
        <p class="subtitle">Online Food Ordering System</p>

        <form id="orderForm">

            <!-- Customer Information -->
            <section>
                <h2>Customer Information</h2>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name">
                    <small class="error" id="nameError"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="example@email.com">
                    <small class="error" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" placeholder="Enter phone number">
                    <small class="error" id="phoneError"></small>
                </div>

                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" placeholder="e.g. 23-12345-1">
                    <small class="error" id="studentIdError"></small>
                </div>

                <!-- Gender -->
                <div class="form-group">
                    <label>Gender</label>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>
                    </div>

                    <small class="error" id="genderError"></small>
                </div>

                <!-- Department -->
                <div class="form-group">
                    <label for="department">Department</label>

                    <select id="department">
                        <option value="">-- Select Department --</option>
                        <option value="CSE">CSE</option>
                        <option value="EEE">EEE</option>
                        <option value="BBA">BBA</option>
                        <option value="English">English</option>
                        <option value="Other">Other</option>
                    </select>

                    <small class="error" id="departmentError"></small>
                </div>
            </section>

            <!-- Food Selection -->
            <section>
                <h2>Food Selection</h2>

                <div class="food-list">

                    <label class="food-item">
                        <input type="checkbox" name="food" value="Burger" data-price="5">
                        <span>Burger</span>
                        <strong>$5</strong>
                    </label>

                    <label class="food-item">
                        <input type="checkbox" name="food" value="Pizza" data-price="8">
                        <span>Pizza</span>
                        <strong>$8</strong>
                    </label>

                    <label class="food-item">
                        <input type="checkbox" name="food" value="Sandwich" data-price="4">
                        <span>Sandwich</span>
                        <strong>$4</strong>
                    </label>

                    <label class="food-item">
                        <input type="checkbox" name="food" value="French Fries" data-price="3">
                        <span>French Fries</span>
                        <strong>$3</strong>
                    </label>

                    <label class="food-item">
                        <input type="checkbox" name="food" value="Coffee" data-price="2">
                        <span>Coffee</span>
                        <strong>$2</strong>
                    </label>

                    <label class="food-item">
                        <input type="checkbox" name="food" value="Cold Drink" data-price="2">
                        <span>Cold Drink</span>
                        <strong>$2</strong>
                    </label>

                </div>

                <small class="error" id="foodError"></small>

                <!-- Quantity -->
                <div class="form-group quantity-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" min="1" value="1">
                    <small class="error" id="quantityError"></small>
                </div>

                <!-- Special Instructions -->
                <div class="form-group">
                    <label for="instructions">Special Instructions</label>
                    <textarea
                        id="instructions"
                        rows="4"
                        placeholder="Any special instructions? (Optional)">
                    </textarea>
                </div>
            </section>

            <button type="submit" class="order-btn">
                Place Order
            </button>

        </form>

        <!-- Order Result -->
        <div id="result" class="result"></div>

    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>
</html>
